name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run core tests
        run: npm run core:test
      - name: Run core CLI tests
        run: npm run cli:test
      - name: Build core
        run: npm run core:build
      - name: Build desktop frontend
        run: npm run desktop:build
      - name: Run desktop tests
        run: npm run desktop:test
      - name: Run tests
        run: npm run test
