name: desktop-package

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop application
        run: npm run desktop:build

      - name: Run desktop tests
        run: npm run desktop:test

      - name: Package macOS installers
        run: npm run desktop:package:mac

      - name: Verify packaged macOS application
        run: npm run package:verify --workspace apps/desktop

      - name: Upload macOS installers
        uses: actions/upload-artifact@v7
        with:
          name: codex-switcher-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop application
        run: npm run desktop:build

      - name: Run desktop tests
        run: npm run desktop:test

      - name: Package Windows installer
        run: npm run desktop:package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: codex-switcher-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
