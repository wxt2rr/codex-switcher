name: desktop-package

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop application
        run: npm run desktop:build

      - name: Run desktop tests
        run: npm run desktop:test

      - name: Package macOS installers
        run: npm run desktop:package:mac

      - name: Verify packaged macOS application
        run: npm run package:verify --workspace apps/desktop

      - name: Upload macOS installers
        uses: actions/upload-artifact@v7
        with:
          name: codex-switcher-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop application
        run: npm run desktop:build

      - name: Run desktop tests
        run: npm run desktop:test

      - name: Package Windows installer
        run: npm run desktop:package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: codex-switcher-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [package-macos, package-windows]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Download packaged installers
        uses: actions/download-artifact@v8
        with:
          pattern: codex-switcher-*
          merge-multiple: true
          path: release-assets

      - name: Validate release assets
        shell: bash
        run: |
          test -n "$(find release-assets -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.blockmap' -print -quit)"
          find release-assets -maxdepth 1 -type f -print

      - name: Create or update GitHub Pre-release
        shell: bash
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            if test -f "$NOTES_FILE"; then
              gh release create "$GITHUB_REF_NAME" release-assets/* \
                --verify-tag \
                --notes-file "$NOTES_FILE" \
                --prerelease \
                --title "$GITHUB_REF_NAME"
            else
              gh release create "$GITHUB_REF_NAME" release-assets/* \
                --verify-tag \
                --generate-notes \
                --prerelease \
                --title "$GITHUB_REF_NAME"
            fi
          fi
